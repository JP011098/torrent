<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Torrents">
<meta name="theme-color" content="#0f1115">
<title>Browser Torrent</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e8eaed; --mute:#8b93a1; --accent:#4f8cff; --ok:#3ecf8e; --bad:#ff5c5c; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font:16px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--text);
         padding:calc(12px + env(safe-area-inset-top)) 12px calc(20px + env(safe-area-inset-bottom)); max-width:720px; margin:auto; }
  h1 { font-size:20px; margin:4px 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:12px; }
  input[type=text] { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0c0e12; color:var(--text); font-size:16px; }
  button, label.btn { display:inline-block; padding:12px 16px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; cursor:pointer; text-align:center; }
  button.ghost, label.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.danger { background:transparent; border:1px solid var(--bad); color:var(--bad); }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .row > * { flex:1; min-width:110px; }
  .meta { color:var(--mute); font-size:13px; margin:4px 0; }
  .name { font-weight:600; word-break:break-word; }
  .bar { height:8px; background:#0c0e12; border-radius:4px; overflow:hidden; margin:8px 0; }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .3s; }
  .bar.done > div { background:var(--ok); }
  .file { border-top:1px solid var(--line); padding:10px 0; }
  .file .n { word-break:break-word; font-size:14px; }
  video, audio { width:100%; border-radius:10px; background:#000; margin-top:8px; max-height:55vh; }
  #msg { color:var(--bad); font-size:14px; margin-top:8px; min-height:1em; }
  .note { color:var(--mute); font-size:13px; }
</style>
</head>
<body>
<h1>🎬 Browser Torrent</h1>

<div class="card">
  <input type="text" id="magnet" placeholder="Paste magnet link…" autocomplete="off" autocapitalize="off" autocorrect="off">
  <div class="row">
    <button id="addBtn">Add magnet</button>
    <label class="btn ghost">Open .torrent<input type="file" id="fileIn" accept=".torrent,application/x-bittorrent" hidden></label>
  </div>
  <div class="row"><button class="ghost" id="demoBtn">Try demo (Sintel, free film)</button></div>
  <div id="msg"></div>
  <p class="note">Works only with torrents that have browser (WebRTC) peers. Most ordinary torrents won't connect. Keep this tab open while downloading; files live in memory until you save them.</p>
</div>

<div id="list"></div>

<script src="https://cdn.jsdelivr.net/npm/webtorrent@1.9.7/webtorrent.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (b) => { if (!b) return '0 B'; const u=['B','KB','MB','GB']; const i=Math.min(3,Math.floor(Math.log(b)/Math.log(1024))); return (b/1024**i).toFixed(i?1:0)+' '+u[i]; };
const TRACKERS = ['wss://tracker.webtorrent.dev','wss://tracker.openwebtorrent.com','wss://tracker.btorrent.xyz'];
const DEMO = 'magnet:?xt=urn:btih:08ada5a7a6183aae1e09d831df6748d566095a10&dn=Sintel&tr=wss%3A%2F%2Ftracker.btorrent.xyz&tr=wss%3A%2F%2Ftracker.openwebtorrent.com&ws=https%3A%2F%2Fwebtorrent.io%2Ftorrents%2F&xs=https%3A%2F%2Fwebtorrent.io%2Ftorrents%2Fsintel.torrent';
const VIDEO = /\.(mp4|m4v|mov|webm)$/i, AUDIO = /\.(mp3|m4a|aac|wav|ogg|opus|flac)$/i;

if (typeof WebTorrent === 'undefined') { $('#msg').textContent = 'Could not load the torrent library. Check your connection and reload.'; }
const client = typeof WebTorrent !== 'undefined' ? new WebTorrent() : null;
if (client) client.on('error', (e) => { $('#msg').textContent = 'Error: ' + (e.message || e); });
if (client && !WebTorrent.WEBRTC_SUPPORT) $('#msg').textContent = 'This browser does not support WebRTC, so torrents will not work here.';

function add(input) {
  if (!client) return;
  $('#msg').textContent = '';
  if (typeof input === 'string' && client.get(input)) { $('#msg').textContent = 'Already added.'; return; }
  try { client.add(input, { announce: TRACKERS }, (t) => render()); render(); }
  catch (e) { $('#msg').textContent = 'Error: ' + e.message; }
}

$('#addBtn').onclick = () => {
  const m = $('#magnet').value.trim();
  if (!m.startsWith('magnet:')) { $('#msg').textContent = 'That is not a magnet link (it should start with magnet:).'; return; }
  add(m); $('#magnet').value = '';
};
$('#demoBtn').onclick = () => add(DEMO);
$('#fileIn').onchange = async (e) => { const f = e.target.files[0]; if (f) add(new Uint8Array(await f.arrayBuffer())); e.target.value = ''; };

function saveFile(file, btn) {
  btn.disabled = true; btn.textContent = 'Preparing…';
  file.getBlob((err, blob) => {
    btn.disabled = false; btn.textContent = 'Save';
    if (err) { $('#msg').textContent = err.message; return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  });
}

function playFile(file, holder, btn) {
  const isAudio = AUDIO.test(file.name);
  const el = document.createElement(isAudio ? 'audio' : 'video');
  el.controls = true; el.playsInline = true; el.setAttribute('playsinline', '');
  holder.innerHTML = ''; holder.appendChild(el);
  const fallback = () => file.getBlobURL((err, url) => { if (err) { holder.textContent = err.message; return; } el.src = url; el.play().catch(()=>{}); });
  if (file.progress === 1) return fallback();
  // Stream while downloading when the browser supports it, otherwise wait for the full file.
  if (window.MediaSource || window.ManagedMediaSource) {
    try { file.renderTo(el, { autoplay: true }, (err) => { if (err) { holder.innerHTML = '<div class="meta">Can\'t stream this yet. It will be playable when it finishes.</div>'; } }); return; } catch (e) {}
  }
  holder.innerHTML = '<div class="meta">This browser can\'t stream while downloading. Tap Play again when the file reaches 100%.</div>';
}

function render() {
  if (!client) return;
  const list = $('#list');
  // Keep existing players alive: only rebuild structure when torrent set changes.
  const ids = client.torrents.map(t => t.infoHash).join(',');
  if (list.dataset.ids !== ids) {
    list.dataset.ids = ids;
    list.innerHTML = '';
    client.torrents.forEach(t => {
      const card = document.createElement('div'); card.className = 'card'; card.dataset.h = t.infoHash;
      card.innerHTML = '<div class="name"></div><div class="bar"><div></div></div><div class="meta stat"></div><div class="files"></div><div class="row"><button class="ghost pause">Pause</button><button class="danger rm">Remove</button></div>';
      card.querySelector('.rm').onclick = () => t.destroy(() => render());
      card.querySelector('.pause').onclick = (e) => { if (t.paused) { t.resume(); e.target.textContent = 'Pause'; } else { t.pause(); e.target.textContent = 'Resume'; } };
      list.appendChild(card);
    });
  }
  client.torrents.forEach(t => {
    const card = list.querySelector(`[data-h="${t.infoHash}"]`); if (!card) return;
    card.querySelector('.name').textContent = t.name || 'Fetching metadata…';
    const bar = card.querySelector('.bar'); bar.classList.toggle('done', t.progress === 1);
    bar.firstElementChild.style.width = (t.progress * 100).toFixed(1) + '%';
    card.querySelector('.stat').textContent = !t.ready ? `Looking for peers… (${t.numPeers} found)`
      : `${(t.progress*100).toFixed(1)}% · ${fmt(t.downloaded)} / ${fmt(t.length)} · ↓ ${fmt(t.downloadSpeed)}/s · ${t.numPeers} peers`;
    const files = card.querySelector('.files');
    if (t.ready && files.dataset.built !== '1') {
      files.dataset.built = '1';
      t.files.forEach((f) => {
        const d = document.createElement('div'); d.className = 'file';
        const playable = VIDEO.test(f.name) || AUDIO.test(f.name);
        d.innerHTML = `<div class="n">${esc(f.name)}</div><div class="meta">${fmt(f.length)}</div><div class="holder"></div><div class="row">${playable ? '<button class="play">▶ Play</button>' : ''}<button class="ghost save">Save</button></div>`;
        const holder = d.querySelector('.holder');
        const p = d.querySelector('.play'); if (p) p.onclick = () => playFile(f, holder, p);
        d.querySelector('.save').onclick = (e) => saveFile(f, e.target);
        files.appendChild(d);
      });
    }
  });
}
setInterval(render, 1000);
</script>
</body>
</html>
